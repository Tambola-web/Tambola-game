<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Tambola</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 10px;
    text-align: center;
}

h1 {
    margin: 8px 0 12px;
    font-size: 24px;
}

.board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    max-width: 600px;
    margin: auto;
}

.number {
    background: white;
    border: 1px solid #ccc;
    padding: 7px 2px;
    font-weight: bold;
    border-radius: 4px;
    font-size: 14px;
}

.number.called {
    background: #222;
    color: white;
}

.controls {
    margin: 10px 0;
}

button {
    font-size: 14px;
    padding: 7px 14px;
    margin: 3px;
    border: none;
    border-radius: 6px;
}

#calledNumbers {
    max-width: 600px;
    margin: 8px auto;
    padding: 5px;
}

.calledNumber {
    display: inline-block;
    margin: 3px;
    padding: 5px 8px;
    background: #ddd;
    border-radius: 4px;
    font-weight: bold;
    font-size: 14px;
}

.tickets {
    max-width: 600px;
    margin: 10px auto;
}

.ticket-container {
    background: white;
    margin: 15px auto;
    padding: 8px;
    border-radius: 8px;
}

.ticket {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    border: 2px solid #333;
}

.cell {
    min-height: 38px;
    border: 1px solid #aaa;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 14px;
}

.cell.marked {
    background: #222;
    color: white;
}

@media (max-width: 500px) {
    body {
        padding: 6px;
    }

    .number {
        padding: 6px 1px;
        font-size: 13px;
    }

    .cell {
        min-height: 35px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<h1>🎟️ Online Tambola</h1>

<div class="board" id="board"></div>

<div class="controls">
    <button onclick="startGame()">▶ Start</button>
    <button onclick="pauseGame()">⏸ Pause</button>
</div>

<div id="calledNumbers"></div>

<div class="tickets">
