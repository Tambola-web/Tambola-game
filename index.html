<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambola</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 10px;
    text-align: center;
}

/* NUMBER BOARD */

.board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    max-width: 600px;
    margin: 10px auto;
}

.number {
    background: white;
    border: 1px solid #ccc;
    padding: 7px 2px;
    font-weight: bold;
    border-radius: 4px;
    font-size: 14px;
}

/* TWO ALTERNATING COLOURS */

.number:nth-child(odd) {
    background: #e6f4ff;
    color: #111;
}

.number:nth-child(even) {
    background: #fff0d9;
    color: #111;
}

/* CALLED NUMBER */

.number.called {
    background: #000;
    color: white;
    border-color: #000;
}

/* CALLED NUMBERS HISTORY */

#calledNumbers {
    max-width: 600px;
    margin: 8px auto;
    padding: 5px;
}

.calledNumber {
    display: inline-block;
    margin: 3px;
    padding: 5px 8px;
    background: #ddd;
    border-radius: 4px;
    font-weight: bold;
    font-size: 14px;
}

/* TICKETS */

.tickets {
    max-width: 600px;
    margin: 10px auto;
}

.ticket-container {
    background: white;
    margin: 15px auto;
    padding: 8px;
    border-radius: 8px;
}

.ticket {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    border: 2px solid #333;
}

.cell {
    min-height: 38px;
    border: 1px solid #aaa;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 14px;
}

.cell.marked {
    background: #000;
    color: white;
}

/* MOBILE */

@media (max-width: 500px) {

    body {
        padding: 6px;
    }

    .number {
        padding: 6px 1px;
        font-size: 13px;
    }

    .cell {
        min-height: 35px;
        font-size: 13px;
    }

}

</style>
</head>

<script>

62: "Turn the screw, number sixty-two",
63: "Tickle me, number sixty-three",

65: "Old age pension, number sixty-five",
66: "Clickety click, number sixty-six",
67: "Made in heaven, number sixty-seven",
68: "Pick a mate, number sixty-eight",
69: "Either way up, number sixty-nine",
70: "Three score and ten, number seventy",

71: "Bang on the drum, number seventy-one",
72: "Six dozen, number seventy-two",
73: "Queen bee, number seventy-three",
74: "Candy store, number seventy-four",
75: "Strive and strive, number seventy-five",

81: "Stop and run, number eighty-one",
82: "Straight on through, number eighty-two",
83: "Time for tea, number eighty-three",
84: "Seven dozen, number eighty-four",
85: "Staying alive, number eighty-five",
86: "Between the sticks, number eighty-six",
87: "Torquay in Devon, number eighty-seven",
88: "Two fat ladies, number eighty-eight",
89: "Almost there, number eighty-nine",
90: "Top of the shop, number ninety"

};


let availableNumbers = [];
let calledNumbers = [];
let gameTimer = null;
let gameRunning = false;


/* CREATE NUMBERS 1-90 */

for (let i = 1; i <= 90; i++) {

    availableNumbers.push(i);

}


/* CREATE BOARD */

let board = document.getElementById("board");


availableNumbers.forEach(function(number) {

    let box = document.createElement("div");

    box.className = "number";

    box.id = "number-" + number;

    box.innerText = number;

    board.appendChild(box);

});


/* CALL RANDOM NUMBER */

function callNumber() {

    if (availableNumbers.length === 0) {

        pauseGame();

        return;

    }


    let randomIndex =
        Math.floor(Math.random() * availableNumbers.length);


    let number =
        availableNumbers.splice(randomIndex, 1)[0];


    calledNumbers.push(number);


    /* HIGHLIGHT NUMBER */

    document
        .getElementById("number-" + number)
        .classList.add("called");


    /* ADD TO CALLED HISTORY */

    let calledBox =
        document.createElement("span");


    calledBox.className = "calledNumber";

    calledBox.innerText = number;


    document
        .getElementById("calledNumbers")
        .appendChild(calledBox);


    /* MARK TICKET */

    let ticketNumbers =
        document.querySelectorAll(
            '[data-number="' + number + '"]'
        );


    ticketNumbers.forEach(function(cell) {

        cell.classList.add("marked");

    });


    /* VOICE CALL */

    let phrase = tambolaCalls[number];


    let speech =
        new SpeechSynthesisUtterance(phrase);


    speech.rate = 0.8;

    speech.pitch = 1;

    speech.volume = 1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);

}


/* START GAME */

function startGame() {

    if (gameRunning) {

        return;

    }


    gameRunning = true;


    /* CALL FIRST NUMBER IMMEDIATELY */

    callNumber();


    /* CALL EVERY 7 SECONDS */

    gameTimer =
        setInterval(callNumber, 7000);

}


/* STOP GAME */

function pauseGame() {

    gameRunning = false;


    if (gameTimer !== null) {

        clearInterval(gameTimer);

        gameTimer = null;

    }


    window.speechSynthesis.cancel();

}


/* START AUTOMATICALLY */

window.onload = function() {

    startGame();

};

</script>
