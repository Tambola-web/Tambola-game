<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 10px;
    text-align: center;
}

/* NUMBER BOARD */

.board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    max-width: 600px;
    margin: 10px auto;
}

.number {
    background: white;
    border: 1px solid #ccc;
    padding: 7px 2px;
    font-weight: bold;
    border-radius: 4px;
    font-size: 14px;
}

/* TWO ALTERNATING COLOURS */

.number:nth-child(odd) {
    background: #e6f4ff;
    color: #111;
}

.number:nth-child(even) {
    background: #fff0d9;
    color: #111;
}

/* CALLED NUMBER */

.number.called {
    background: #000;
    color: white;
    border-color: #000;
}

/* CALLED NUMBERS HISTORY */

#calledNumbers {
    max-width: 600px;
    margin: 8px auto;
    padding: 5px;
}

.calledNumber {
    display: inline-block;
    margin: 3px;
    padding: 5px 8px;
    background: #ddd;
    border-radius: 4px;
    font-weight: bold;
    font-size: 14px;
}

/* TICKETS */

.tickets {
    max-width: 600px;
    margin: 10px auto;
}

.ticket-container {
    background: white;
    margin: 15px auto;
    padding: 8px;
    border-radius: 8px;
}

.ticket {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    border: 2px solid #333;
}

.cell {
    min-height: 38px;
    border: 1px solid #aaa;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 14px;
}

.cell.marked {
    background: #000;
    color: white;
}

/* MOBILE */

@media (max-width: 500px) {

    body {
        padding: 6px;
    }

    .number {
        padding: 6px 1px;
        font-size: 13px;
    }

    .cell {
        min-height: 35px;
        font-size: 13px;
    }

}

</style>
</head>
