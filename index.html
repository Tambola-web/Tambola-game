<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Tambola</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f4f4;
        margin: 0;
        padding: 15px;
    }

    h1 {
        margin-bottom: 5px;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 5px;
        max-width: 600px;
        margin: 20px auto;
    }

    .number {
        background: white;
        border: 1px solid #ccc;
        padding: 10px 3px;
        font-weight: bold;
        border-radius: 4px;
    }

    .called {
        background: #333;
        color: white;
    }

    button {
        font-size: 18px;
        padding: 12px 25px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        margin: 10px;
    }

    #calledNumbers {
        margin: 20px auto;
        max-width: 600px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        min-height: 40px;
    }

    .calledNumber {
        display: inline-block;
        margin: 5px;
        padding: 8px 12px;
        background: #ddd;
        border-radius: 5px;
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>🎟️ Online Tambola</h1>

<button onclick="callNumber()">Call Number</button>

<h2>Numbers Called</h2>

<div id="calledNumbers"></div>

<h2>1–90 Number Board</h2>

<div class="board" id="board"></div>

<script>

let availableNumbers = [];

let calledNumbers = [];

// Create numbers 1–90
for (let i = 1; i <= 90; i++) {
    availableNumbers.push(i);
}

// Create number board
let board = document.getElementById("board");

availableNumbers.forEach(function(number) {

    let box = document.createElement("div");

    box.className = "number";

    box.id = "number-" + number;

    box.innerText = number;

    board.appendChild(box);
});

function callNumber() {

    // Check if all numbers have been called
    if (availableNumbers.length === 0) {
        alert("All 90 numbers have been called!");
        return;
    }

    // Select random number
    let randomIndex =
        Math.floor(Math.random() * availableNumbers.length);

    let number =
        availableNumbers.splice(randomIndex, 1)[0];

    // Save called number
    calledNumbers.push(number);

    // Mark number on board
    document
        .getElementById("number-" + number)
        .classList.add("called");

    // Show called number below
    let calledBox =
        document.createElement("span");

    calledBox.className = "calledNumber";

    calledBox.innerText = number;

    document
        .getElementById("calledNumbers")
        .appendChild(calledBox);
}

</script>

</body>
</html>
